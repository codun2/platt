# ركائز (Rakeez) — Laravel API + Nuxt SPA (static) + MySQL.
# Secrets come from /opt/platt/.env (never committed) — see .env.example.
# Host nginx: https://rekaz.smartunita.com (Cloudflare, 80/443) and :8100 (IP) reverse-proxy → 127.0.0.1:8014 (platt-web).
name: platt

services:
  platt-db:
    image: mysql:8.0
    container_name: platt-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: platt
      MYSQL_USER: platt
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - platt-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [platt-net]

  platt-api:
    build: ./api
    container_name: platt-api
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://rekaz.smartunita.com}
      DB_CONNECTION: mysql
      DB_HOST: platt-db
      DB_PORT: "3306"
      DB_DATABASE: platt
      DB_USERNAME: platt
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@rakeez.app}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Quick-login chips on the login page (demo accounts). Set false on a real production.
      QUICK_LOGINS: ${QUICK_LOGINS:-true}
      LOG_CHANNEL: daily
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      # PHP built-in server: several workers so cashiers do not queue behind each other.
      PHP_CLI_SERVER_WORKERS: "8"
    volumes:
      - ./api:/app
      - platt-api-storage:/app/storage/app/public
    depends_on:
      platt-db:
        condition: service_healthy
    networks: [platt-net]

  platt-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platt-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8014:80"
    depends_on:
      - platt-api
    networks: [platt-net]

volumes:
  platt-db-data:
  platt-api-storage:

networks:
  platt-net:
